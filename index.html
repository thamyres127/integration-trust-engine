
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Trust Engine</title>

    <style>
        :root {
            --background: #111827;
            --surface: #1E293B;
            --surface-light: #273449;
            --primary: #38BDF8;
            --purple: #A78BFA;
            --green: #10B981;
            --red: #EF4444;
            --yellow: #F59E0B;
            --text: #F8FAFC;
            --muted: #94A3B8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        button, input, select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #0B1220;
            border-right: 1px solid var(--border);
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            margin-bottom: 42px;
        }

        .brand h2 {
            color: var(--primary);
            font-size: 19px;
            margin-bottom: 7px;
        }

        .brand p {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .menu-label {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 14px 10px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu button {
            background: transparent;
            border: none;
            color: var(--muted);
            text-align: left;
            padding: 13px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .menu button:hover,
        .menu button.active {
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 15px 10px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        .sidebar-footer span {
            color: var(--green);
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 35px;
            min-width: 0;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .topbar h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .topbar p {
            color: var(--muted);
            font-size: 13px;
        }

        .primary-button {
            background: var(--primary);
            color: #082032;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .primary-button:hover {
            background: #7DD3FC;
            transform: translateY(-1px);
        }

        /* DASHBOARD */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
        }

        .stat-card p {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 15px;
        }

        .stat-card h2 {
            font-size: 30px;
        }

        .stat-card small {
            display: block;
            color: var(--muted);
            margin-top: 8px;
        }

        .blue { color: var(--primary); }
        .green { color: var(--green); }
        .red { color: var(--red); }
        .yellow { color: var(--yellow); }
        .purple { color: var(--purple); }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .panel-header h2 {
            font-size: 17px;
        }

        .panel-header span {
            color: var(--muted);
            font-size: 12px;
        }

        /* TABLE */

        .table-wrapper {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .data-table th {
            text-align: left;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
        }

        .data-table td {
            padding: 16px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .data-table tbody tr:hover {
            background: rgba(255,255,255,0.025);
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .badge-active {
            background: rgba(16,185,129,0.13);
            color: var(--green);
        }

        .badge-inactive {
            background: rgba(239,68,68,0.13);
            color: var(--red);
        }

        .badge-maintenance {
            background: rgba(245,158,11,0.13);
            color: var(--yellow);
        }

        .badge-valid {
            background: rgba(16,185,129,0.13);
            color: var(--green);
        }

        .badge-expiring {
            background: rgba(245,158,11,0.13);
            color: var(--yellow);
        }

        .badge-expired {
            background: rgba(239,68,68,0.13);
            color: var(--red);
        }

        /* SEARCH */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            width: 100%;
            max-width: 380px;
            padding: 12px 14px;
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
        }

        .search-input:focus,
        .form-control:focus {
            border-color: var(--primary);
        }

        /* ALERTS */

        .alert-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .alert-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: var(--surface-light);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid var(--yellow);
        }

        .alert-item.expired {
            border-left-color: var(--red);
        }

        .alert-item p {
            font-size: 13px;
            margin-bottom: 5px;
        }

        .alert-item small {
            color: var(--muted);
            font-size: 11px;
        }

        .empty-state {
            padding: 35px 15px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            color: var(--muted);
        }

        .form-control {
            width: 100%;
            background: #111827;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 12px;
            outline: none;
        }

        .form-control option {
            background: var(--surface);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .secondary-button {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 11px 16px;
            border-radius: 8px;
        }

        .secondary-button:hover {
            background: var(--surface-light);
        }

        .hidden {
            display: none !important;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 18px;
            }

            .brand {
                margin-bottom: 20px;
            }

            .menu {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar-footer {
                margin-top: 20px;
            }

            .main {
                padding: 22px 16px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-card h2 {
                font-size: 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }

        @media (max-width: 380px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <h2>Integration Trust</h2>
            <p>ENGINE · GOVERNANCE</p>
        </div>

        <p class="menu-label">Menu principal</p>

        <nav class="menu">
            <button type="button" data-view="dashboard" class="active">
                ◈ Dashboard
            </button>

            <button type="button" data-view="integrations">
                ⇄ Integrações
            </button>

            <button type="button" data-view="certificates">
                ◉ Certificados
            </button>

            <button type="button" data-view="monitoring">
                ◷ Monitoramento
            </button>
        </nav>

        <div class="sidebar-footer">
            <p>● <span>Interface operacional</span></p>
            <p style="margin-top:7px;">Integration Trust Engine</p>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <p id="pageDescription">
                    Visão geral da governança de integrações.
                </p>
            </div>

            <button
                type="button"
                class="primary-button"
                id="newIntegrationButton"
            >
                + Nova integração
            </button>
        </header>

        <div id="viewContainer"></div>

    </main>

</div>

                        maxlength="150"
                        placeholder="Ex: Payment Service"
                    >
                </div>

                <div class="form-group">
                    <label for="targetSystem">Sistema de destino *</label>
                    <input
                        class="form-control"
                        id="targetSystem"
                        name="targetSystem"
                        required
                        maxlength="150"
                        placeholder="Ex: Banking
