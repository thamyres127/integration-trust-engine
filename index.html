<!DOCTYPE html>


<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Trust Engine</title>


<style>
:root {
--background: #111827;
--surface: #1E293B;
--surface-light: #273449;
--primary: #38BDF8;
--purple: #A78BFA;
--green: #10B981;
--red: #EF4444;
--yellow: #F59E0B;
--text: #F8FAFC;
--muted: #94A3B8;
--border: #334155;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: Arial, Helvetica, sans-serif;
background: var(--background);
color: var(--text);
min-height: 100vh;
}

button, input, select {
font: inherit;
}

button {
cursor: pointer;
}

.app {
display: flex;
min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
width: 250px;
background: #0B1220;
border-right: 1px solid var(--border);
padding: 28px 18px;
display: flex;
flex-direction: column;
flex-shrink: 0;
}

.brand {
margin-bottom: 42px;
}

.brand h2 {
color: var(--primary);
font-size: 19px;
margin-bottom: 7px;
}

.brand p {
color: var(--muted);
font-size: 11px;
letter-spacing: 1px;
}

.menu-label {
color: var(--muted);
font-size: 10px;
text-transform: uppercase;
letter-spacing: 1.5px;
margin: 0 0 14px 10px;
}

.menu {
display: flex;
flex-direction: column;
gap: 8px;
}

.menu button {
background: transparent;
border: none;
color: var(--muted);
text-align: left;
padding: 13px 12px;
border-radius: 8px;
transition: 0.2s;
}

.menu button:hover,
.menu button.active {
background: rgba(56, 189, 248, 0.12);
color: var(--primary);
}

.sidebar-footer {
margin-top: auto;
padding: 15px 10px;
border-top: 1px solid var(--border);
color: var(--muted);
font-size: 12px;
}

.sidebar-footer span {
color: var(--green);
}

/* MAIN */

.main {
flex: 1;
padding: 35px;
min-width: 0;
}

.topbar {
display: flex;
justify-content: space-between;
align-items: center;
gap: 20px;
margin-bottom: 32px;
}

.topbar h1 {
font-size: 27px;
margin-bottom: 8px;
}

.topbar p {
color: var(--muted);
font-size: 13px;
}

.primary-button {
background: var(--primary);
color: #082032;
border: none;
border-radius: 8px;
padding: 12px 18px;
font-weight: bold;
transition: 0.2s;
}

.primary-button:hover {
background: #7DD3FC;
transform: translateY(-1px);
}

/* DASHBOARD */

.stats-grid {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: 18px;
margin-bottom: 28px;
}

.stat-card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 12px;
padding: 22px;
}

.stat-card p {
color: var(--muted);
font-size: 13px;
margin-bottom: 15px;
}

.stat-card h2 {
font-size: 30px;
}

.stat-card small {
display: block;
color: var(--muted);
margin-top: 8px;
}

.blue { color: var(--primary); }
.green { color: var(--green); }
.red { color: var(--red); }
.yellow { color: var(--yellow); }
.purple { color: var(--purple); }

.panel {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 12px;
padding: 22px;
margin-bottom: 25px;
}

.panel-header {
display: flex;
justify-content: space-between;
align-items: center;
gap: 15px;
margin-bottom: 20px;
}

.panel-header h2 {
font-size: 17px;
}

.panel-header span {
color: var(--muted);
font-size: 12px;
}

/* TABLE */

.table-wrapper {
overflow-x: auto;
}

.data-table {
width: 100%;
border-collapse: collapse;
min-width: 700px;
}

.data-table th {
text-align: left;
color: var(--muted);
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.6px;
padding: 14px 12px;
border-bottom: 1px solid var(--border);
}

.data-table td {
padding: 16px 12px;
border-bottom: 1px solid var(--border);
font-size: 13px;
}

.data-table tbody tr:hover {
background: rgba(255,255,255,0.025);
}

.badge {
display: inline-block;
padding: 5px 9px;
border-radius: 20px;
font-size: 10px;
font-weight: bold;
}

.badge-active,
.badge-valid {
background: rgba(16,185,129,0.13);
color: var(--green);
}

.badge-inactive,
.badge-expired {
background: rgba(239,68,68,0.13);
color: var(--red);
}

.badge-maintenance,
.badge-expiring {
background: rgba(245,158,11,0.13);
color: var(--yellow);
}

/* SEARCH */

.toolbar {
display: flex;
justify-content: space-between;
align-items: center;
gap: 15px;
margin-bottom: 20px;
flex-wrap: wrap;
}

.search-input {
width: 100%;
max-width: 380px;
padding: 12px 14px;
background: #111827;
border: 1px solid var(--border);
border-radius: 8px;
color: var(--text);
outline: none;
}

.search-input:focus,
.form-control:focus {
border-color: var(--primary);
}

/* ALERTS */

.alert-list {
display: flex;
flex-direction: column;
gap: 12px;
}

.alert-item {
display: flex;
justify-content: space-between;
align-items: center;
gap: 15px;
background: var(--surface-light);
padding: 15px;
border-radius: 8px;
border-left: 3px solid var(--yellow);
}

.alert-item.expired {
border-left-color: var(--red);
}

.alert-item p {
font-size: 13px;
margin-bottom: 5px;
}

.alert-item small {
color: var(--muted);
font-size: 11px;
}

.empty-state {
padding: 35px 15px;
text-align: center;
color: var(--muted);
font-size: 13px;
}

/* MODAL */

.modal-overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.75);
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
z-index: 1000;
}

.modal {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 14px;
width: 100%;
max-width: 600px;
max-height: 90vh;
overflow-y: auto;
padding: 25px;
}

.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 25px;
}

.modal-header h2 {
font-size: 19px;
}

.close-button {
background: transparent;
border: none;
color: var(--muted);
font-size: 25px;
}

.form-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 17px;
}

.form-group {
display: flex;
flex-direction: column;
gap: 8px;
}

.form-group.full {
grid-column: 1 / -1;
}

.form-group label {
font-size: 12px;
color: var(--muted);
}

.form-control {
width: 100%;
background: #111827;
color: var(--text);
border: 1px solid var(--border);
border-radius: 7px;
padding: 12px;
outline: none;
}

.form-control option {
background: var(--surface);
}

.modal-actions {
display: flex;
justify-content: flex-end;
gap: 10px;
margin-top: 25px;
}

.secondary-button {
background: transparent;
color: var(--muted);
border: 1px solid var(--border);
padding: 11px 16px;
border-radius: 8px;
}

.secondary-button:hover {
background: var(--surface-light);
}

.hidden {
display: none !important;
}

/* RESPONSIVE */

@media (max-width: 1000px) {
.stats-grid {
grid-template-columns: repeat(2, 1fr);
}
}

@media (max-width: 700px) {
.app {
flex-direction: column;
}

.sidebar {
width: 100%;
padding: 18px;
}

.brand {
margin-bottom: 20px;
}

.menu {
display: grid;
grid-template-columns: repeat(2, 1fr);
}

.sidebar-footer {
margin-top: 20px;
}

.main {
padding: 22px 16px;
}

.topbar {
align-items: flex-start;
flex-direction: column;
}

.stats-grid {
grid-template-columns: 1fr 1fr;
gap: 10px;
}

.stat-card {
padding: 16px;
}

.stat-card h2 {
font-size: 24px;
}

.form-grid {
grid-template-columns: 1fr;
}

.form-group.full {
grid-column: auto;
}
}

@media (max-width: 380px) {
.stats-grid {
grid-template-columns: 1fr;
}
}

.action-buttons {
display: flex;
gap: 7px;
white-space: nowrap;
}

.action-button {
border: 1px solid var(--border);
background: transparent;
color: var(--text);
border-radius: 6px;
padding: 7px 9px;
font-size: 11px;
}

.action-button.edit {
color: var(--primary);
border-color: rgba(56,189,248,0.35);
}

.action-button.delete {
color: var(--red);
border-color: rgba(239,68,68,0.35);
}

.action-button:hover {
background: var(--surface-light);
}
</style>

</head>

```javascript
/*
 * INTEGRATION TRUST ENGINE
 * Frontend conectado à API Spring Boot e PostgreSQL.
 */

const API_BASE_URL = "https://integration-trust-engine.onrender.com";

let integrations = [];
let currentView = "dashboard";
let searchTerm = "";
let editingIntegrationId = null;

const viewContainer = document.getElementById("viewContainer");
const modal = document.getElementById("integrationModal");
const form = document.getElementById("integrationForm");
const pageTitle = document.getElementById("pageTitle");
const pageDescription = document.getElementById("pageDescription");
const submitButton = form.querySelector('button[type="submit"]');

async function readApiError(response) {
    try {
        const data = await response.json();
        return data.message || data.error || `Erro HTTP ${response.status}`;
    } catch {
        return `Erro HTTP ${response.status}`;
    }
}

async function loadIntegrations() {
    const response = await fetch(`${API_BASE_URL}/api/integrations`, {
        method: "GET",
        headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
        throw new Error(await readApiError(response));
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
        throw new Error("A API retornou um formato inesperado.");
    }

    integrations = data;
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}

function getToday() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function formatDate(date) {
    if (!date) return "-";
    const parts = String(date).split("-");
    return parts.length === 3
        ? `${parts[2]}/${parts[1]}/${parts[0]}`
        : date;
}

function getCertificateStatus(expirationDate) {
    if (!expirationDate) {
        return { label: "Sem data", className: "badge-expired", days: null };
    }

    const today = new Date(`${getToday()}T00:00:00`);
    const expiration = new Date(`${expirationDate}T00:00:00`);
    const difference = Math.ceil(
        (expiration - today) / (1000 * 60 * 60 * 24)
    );

    if (difference < 0) {
        return {
            label: "Vencido",
            className: "badge-expired",
            days: difference
        };
    }

    if (difference <= 30) {
        return {
            label: "Próximo do vencimento",
            className: "badge-expiring",
            days: difference
        };
    }

    return {
        label: "Válido",
        className: "badge-valid",
        days: difference
    };
}

function getStatistics() {
    return {
        total: integrations.length,
        active: integrations.filter(item =>
            item.operationalStatus === "ACTIVE"
        ).length,
        expired: integrations.filter(item =>
            getCertificateStatus(item.certificateExpirationDate)
                .className === "badge-expired"
        ).length,
        expiring: integrations.filter(item =>
            getCertificateStatus(item.certificateExpirationDate)
                .className === "badge-expiring"
        ).length
    };
}

function getOperationalBadge(status) {
    const labels = {
        ACTIVE: ["Ativo", "badge-active"],
        INACTIVE: ["Inativo", "badge-inactive"],
        MAINTENANCE: ["Manutenção", "badge-maintenance"]
    };

    const result = labels[status] || ["Desconhecido", "badge-inactive"];
    return `<span class="badge ${result[1]}">${result[0]}</span>`;
}

function renderIntegrationRows(items, showActions = false) {
    if (items.length === 0) {
        return `
            <tr>
                <td colspan="${showActions ? 8 : 7}">
                    <div class="empty-state">
                        Nenhuma integração encontrada.
                    </div>
                </td>
            </tr>
        `;
    }

    return items.map(item => {
        const certificate = getCertificateStatus(
            item.certificateExpirationDate
        );

        return `
            <tr>
                <td><strong>${escapeHTML(item.name)}</strong></td>
                <td>${escapeHTML(item.sourceSystem)}</td>
                <td>${escapeHTML(item.targetSystem)}</td>
                <td>${escapeHTML(item.technicalOwner)}</td>
                <td>${formatDate(item.certificateExpirationDate)}</td>
                <td>
                    <span class="badge ${certificate.className}">
                        ${certificate.label}
                    </span>
                </td>
                <td>${getOperationalBadge(item.operationalStatus)}</td>
                ${showActions ? `
                    <td>
                        <div class="action-buttons">
                            <button
                                type="button"
                                class="action-button edit"
                                data-action="edit"
                                data-id="${escapeHTML(item.id)}"
                            >Editar</button>

                            <button
                                type="button"
                                class="action-button delete"
                                data-action="delete"
                                data-id="${escapeHTML(item.id)}"
                            >Excluir</button>
                        </div>
                    </td>
                ` : ""}
            </tr>
        `;
    }).join("");
}

function renderIntegrationTable(items, showActions = false) {
    return `
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Integração</th>
                        <th>Origem</th>
                        <th>Destino</th>
                        <th>Responsável</th>
                        <th>Validade</th>
                        <th>Certificado</th>
                        <th>Status</th>
                        ${showActions ? "<th>Ações</th>" : ""}
                    </tr>
                </thead>
                <tbody>
                    ${renderIntegrationRows(items, showActions)}
                </tbody>
            </table>
        </div>
    `;
}

function renderDashboard() {
    const stats = getStatistics();
    const recent = integrations.slice(-5).reverse();

    viewContainer.innerHTML = `
        <section class="stats-grid">
            <div class="stat-card">
                <p>Total de integrações</p>
                <h2 class="blue">${stats.total}</h2>
                <small>Integrações cadastradas</small>
            </div>

            <div class="stat-card">
                <p>Integrações ativas</p>
                <h2 class="green">${stats.active}</h2>
                <small>Operação ativa</small>
            </div>

            <div class="stat-card">
                <p>Certificados vencidos</p>
                <h2 class="red">${stats.expired}</h2>
                <small>Exigem atenção</small>
            </div>

            <div class="stat-card">
                <p>Próximos do vencimento</p>
                <h2 class="yellow">${stats.expiring}</h2>
                <small>Vencimento em até 30 dias</small>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Integrações cadastradas</h2>
                <span>${stats.total} registros</span>
            </div>
            ${renderIntegrationTable(recent)}
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Resumo de certificados</h2>
                <span>Monitoramento de validade</span>
            </div>
            ${renderCertificateAlerts()}
        </section>
    `;
}

function getFilteredIntegrations() {
    const term = searchTerm.trim().toLowerCase();
    if (!term) return integrations;

    return integrations.filter(item => {
        const searchable = [
            item.name,
            item.sourceSystem,
            item.targetSystem,
            item.technicalOwner,
            item.certificateSerialNumber,
            item.operationalStatus,
            getCertificateStatus(item.certificateExpirationDate).label
        ].join(" ").toLowerCase();

        return searchable.includes(term);
    });
}

function renderIntegrations() {
    const filtered = getFilteredIntegrations();

    viewContainer.innerHTML = `
        <section class="panel">
            <div class="panel-header">
                <h2>Integrações cadastradas</h2>
                <span>${integrations.length} registros</span>
            </div>

            <div class="toolbar">
                <input
                    type="search"
                    class="search-input"
                    id="integrationSearch"
                    placeholder="Pesquisar integração, sistema, responsável..."
                    value="${escapeHTML(searchTerm)}"
                >
                <span style="color:var(--muted);font-size:12px;">
                    ${filtered.length} resultado(s)
                </span>
            </div>

            <div id="integrationTableContainer">
                ${renderIntegrationTable(filtered, true)}
            </div>
        </section>
    `;

    document.getElementById("integrationSearch")
        .addEventListener("input", event => {
            searchTerm = event.target.value;
            const results = getFilteredIntegrations();

            document.getElementById("integrationTableContainer").innerHTML =
                renderIntegrationTable(results, true);

            document.querySelector(".toolbar span").textContent =
                `${results.length} resultado(s)`;
        });
}

function renderCertificates() {
    const valid = integrations.filter(item =>
        getCertificateStatus(item.certificateExpirationDate)
            .className === "badge-valid"
    );

    const expiring = integrations.filter(item =>
        getCertificateStatus(item.certificateExpirationDate)
            .className === "badge-expiring"
    );

    const expired = integrations.filter(item =>
        getCertificateStatus(item.certificateExpirationDate)
            .className === "badge-expired"
    );

    viewContainer.innerHTML = `
        <section class="stats-grid">
            <div class="stat-card">
                <p>Certificados válidos</p>
                <h2 class="green">${valid.length}</h2>
            </div>
            <div class="stat-card">
                <p>Próximos do vencimento</p>
                <h2 class="yellow">${expiring.length}</h2>
            </div>
            <div class="stat-card">
                <p>Certificados vencidos</p>
                <h2 class="red">${expired.length}</h2>
            </div>
            <div class="stat-card">
                <p>Total monitorado</p>
                <h2 class="blue">${integrations.length}</h2>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Inventário de certificados</h2>
                <span>Validade e identificação</span>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Integração</th>
                            <th>Número do certificado</th>
                            <th>Responsável</th>
                            <th>Data de validade</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${integrations.map(item => {
                            const status = getCertificateStatus(
                                item.certificateExpirationDate
                            );

                            return `
                                <tr>
                                    <td>${escapeHTML(item.name)}</td>
                                    <td>${escapeHTML(item.certificateSerialNumber)}</td>
                                    <td>${escapeHTML(item.technicalOwner)}</td>
                                    <td>${formatDate(item.certificateExpirationDate)}</td>
                                    <td>
                                        <span class="badge ${status.className}">
                                            ${status.label}
                                        </span>
                                    </td>
                                </tr>
                            `;
                        }).join("")}
                    </tbody>
                </table>
            </div>
        </section>
    `;
}

function renderCertificateAlerts() {
    const alerts = integrations
        .map(item => ({
            ...item,
            certificateStatus: getCertificateStatus(
                item.certificateExpirationDate
            )
        }))
        .filter(item =>
            item.certificateStatus.className !== "badge-valid"
        )
        .sort((a, b) =>
            (a.certificateStatus.days ?? 0) -
            (b.certificateStatus.days ?? 0)
        );

    if (alerts.length === 0) {
        return `
            <div class="empty-state">
                Nenhum certificado vencido ou próximo do vencimento.
            </div>
        `;
    }

    return `
        <div class="alert-list">
            ${alerts.map(item => {
                const expired = item.certificateStatus.days < 0;
                const message = expired
                    ? `Certificado vencido há ${Math.abs(item.certificateStatus.days)} dia(s)`
                    : `Certificado vence em ${item.certificateStatus.days} dia(s)`;

                return `
                    <div class="alert-item ${expired ? "expired" : ""}">
                        <div>
                            <p><strong>${escapeHTML(item.name)}</strong></p>
                            <small>
                                ${escapeHTML(item.certificateSerialNumber)}
                                · ${escapeHTML(item.technicalOwner)}
                            </small>
                        </div>
                        <div>
                            <span class="badge ${item.certificateStatus.className}">
                                ${message}
                            </span>
                        </div>
                    </div>
                `;
            }).join("")}
        </div>
    `;
}

function renderMonitoring() {
    const stats = getStatistics();

    viewContainer.innerHTML = `
        <section class="stats-grid">
            <div class="stat-card">
                <p>Integrações monitoradas</p>
                <h2 class="blue">${stats.total}</h2>
            </div>
            <div class="stat-card">
                <p>Certificados vencidos</p>
                <h2 class="red">${stats.expired}</h2>
            </div>
            <div class="stat-card">
                <p>Próximos vencimentos</p>
                <h2 class="yellow">${stats.expiring}</h2>
            </div>
            <div class="stat-card">
                <p>Integrações ativas</p>
                <h2 class="green">${stats.active}</h2>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Central de alertas</h2>
                <span>Certificados que exigem atenção</span>
            </div>
            ${renderCertificateAlerts()}
        </section>
    `;
}

function navigate(view) {
    currentView = view;

    const pages = {
        dashboard: {
            title: "Dashboard",
            description: "Visão geral da governança de integrações."
        },
        integrations: {
            title: "Integrações",
            description: "Gerencie e consulte as integrações cadastradas."
        },
        certificates: {
            title: "Certificados",
            description: "Inventário e controle de validade dos certificados."
        },
        monitoring: {
            title: "Monitoramento",
            description: "Acompanhe riscos e alertas das integrações."
        }
    };

    const page = pages[view];
    if (!page) return;

    pageTitle.textContent = page.title;
    pageDescription.textContent = page.description;

    document.querySelectorAll("[data-view]").forEach(button => {
        button.classList.toggle("active", button.dataset.view === view);
    });

    if (view === "dashboard") renderDashboard();
    if (view === "integrations") renderIntegrations();
    if (view === "certificates") renderCertificates();
    if (view === "monitoring") renderMonitoring();
}

document.querySelectorAll("[data-view]").forEach(button => {
    button.addEventListener("click", () => {
        searchTerm = "";
        navigate(button.dataset.view);
    });
});

viewContainer.addEventListener("click", async event => {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;

    const integration = integrations.find(
        item => String(item.id) === String(id)
    );

    if (!integration) {
        alert("Não foi possível localizar essa integração.");
        return;
    }

    if (action === "edit") {
        openIntegrationModal(integration);
        return;
    }

    if (action === "delete") {
        const confirmed = confirm(
            `Tem certeza de que deseja excluir a integração "${integration.name}"? Essa ação não poderá ser desfeita.`
        );

        if (!confirmed) return;

        button.disabled = true;
        button.textContent = "Excluindo...";

        try {
            const response = await fetch(
                `${API_BASE_URL}/api/integrations/${encodeURIComponent(id)}`,
                {
                    method: "DELETE",
                    headers: { "Accept": "application/json" }
                }
            );

            if (!response.ok) {
                throw new Error(await readApiError(response));
            }

            await loadIntegrations();
            navigate(currentView);

            alert("Integração excluída com sucesso!");

        } catch (error) {
            console.error("Erro ao excluir integração:", error);

            alert(
                `Não foi possível excluir a integração: ${error.message}`
            );

            button.disabled = false;
            button.textContent = "Excluir";
        }
    }
});

 */

form.addEventListener("submit", async event => {
    event.preventDefault();

    if (!form.reportValidity()) return;

    const originalButtonText = submitButton.textContent;
    const formData = new FormData(form);

    const integrationData = {
        name: formData.get("name").trim(),
        sourceSystem: formData.get("sourceSystem").trim(),
        targetSystem: formData.get("targetSystem").trim(),
        technicalOwner: formData.get("technicalOwner").trim(),
        certificateSerialNumber:
            formData.get("certificateSerialNumber").trim(),
        certificateExpirationDate:
            formData.get("certificateExpirationDate"),
        operationalStatus: formData.get("operationalStatus")
    };

    if (Object.values(integrationData).some(value => !value)) {
        alert("Preencha todos os campos obrigatórios.");
        return;
    }

    const isEditing = editingIntegrationId !== null;

    const url = isEditing
        ? `${API_BASE_URL}/api/integrations/${encodeURIComponent(editingIntegrationId)}`
        : `${API_BASE_URL}/api/integrations`;

    const method = isEditing ? "PUT" : "POST";

    submitButton.disabled = true;
    submitButton.textContent = isEditing
        ? "Atualizando..."
        : "Salvando...";

    try {
        const response = await fetch(url, {
            method,
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify(integrationData)
        });

        if (!response.ok) {
            throw new Error(await readApiError(response));
        }

        await loadIntegrations();

        closeIntegrationModal();
        searchTerm = "";
        navigate(currentView);

        alert(isEditing
            ? "Integração atualizada com sucesso!"
            : "Integração cadastrada com sucesso!");

    } catch (error) {
        console.error("Erro ao salvar integração:", error);

        alert(
            `Não foi possível ${isEditing ? "atualizar" : "cadastrar"} a integração: ${error.message}\n\n` +
            "Verifique se a API está disponível e se o CORS está configurado."
        );

    } finally {
        submitButton.disabled = false;
        submitButton.textContent = originalButtonText;
    }
});
